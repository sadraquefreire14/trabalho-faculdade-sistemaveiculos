<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Veículos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="container">
        <h1><img src="logo (2).png" alt="Logo" class="logo-header"> Veículos Cadastrados</h1>
        <p class="subtitle">Lista completa de veículos disponíveis para venda</p>

        <div id="loading" class="loading">Carregando dados...</div>
        <div id="erro" class="erro" style="display:none;"></div>

        <div class="table-container">
            <table id="tabelaVeiculos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Placa</th>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Ano Fab.</th>
                        <th>Ano Mod.</th>
                        <th>Cor</th>
                        <th>Combustível</th>
                        <th>KM</th>
                        <th>Chassi</th>
                        <th>Renavam</th>
                        <th>Data Cad.</th>
                        <th>Observações</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>

        <div id="sem-dados" class="sem-dados" style="display:none;">
            <p>Nenhum veículo cadastrado ainda.</p>
        </div>

        <div class="links">
            <a href="index.html" class="link">⬅️ Voltar ao cadastro</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loading = document.getElementById('loading');
            const erro = document.getElementById('erro');
            const tbody = document.querySelector('#tabelaVeiculos tbody');
            const semDados = document.getElementById('sem-dados');

            fetch('php/listar.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Erro na resposta do servidor');
                    }
                    return response.json();
                })
                .then(dados => {
                    loading.style.display = 'none';

                    if (!Array.isArray(dados) || dados.length === 0) {
                        semDados.style.display = 'block';
                        document.querySelector('.table-container').style.display = 'none';
                        return;
                    }

                    dados.forEach(v => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${v.id}</td>
                            <td>${v.placa || '-'}</td>
                            <td>${v.marca || '-'}</td>
                            <td>${v.modelo || '-'}</td>
                            <td>${v.ano_fabricacao || '-'}</td>
                            <td>${v.ano_modelo || '-'}</td>
                            <td>${v.cor || '-'}</td>
                            <td>${v.combustivel || '-'}</td>
                            <td>${v.quilometragem !== null ? parseInt(v.quilometragem).toLocaleString('pt-BR') + ' km' : '-'}</td>
                            <td>${v.chassi || '-'}</td>
                            <td>${v.renavam || '-'}</td>
                            <td>${v.data_cadastro ? new Date(v.data_cadastro).toLocaleDateString('pt-BR') : '-'}</td>
                            <td class="obs">${v.observacoes || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    loading.style.display = 'none';
                    erro.style.display = 'block';
                    erro.textContent = 'Erro ao carregar dados: ' + error.message;
                    console.error('Erro:', error);
                });
        });
    </script>
</body>
</html>
