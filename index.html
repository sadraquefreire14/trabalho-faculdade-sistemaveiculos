<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Veículos</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div class="container">
        <h1><img src="logo (2).png" alt="Logo" class="logo-header"> Cadastro de Veículos</h1>
        <p class="subtitle">Preencha todos os campos obrigatórios</p>

        <form id="formVeiculo">
            <div class="form-group">
                <label for="placa">Placa *</label>
                <input type="text" id="placa" name="placa" placeholder="ABC-1234" required maxlength="10">
            </div>

            <div class="form-group">
                <label for="marca">Marca *</label>
                <input type="text" id="marca" name="marca" placeholder="Ex: Toyota, Honda, Ford" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="modelo">Modelo *</label>
                <input type="text" id="modelo" name="modelo" placeholder="Ex: Corolla, Civic" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="ano_fabricacao">Ano de Fabricação *</label>
                <input type="number" id="ano_fabricacao" name="ano_fabricacao" placeholder="2024" required min="1900" max="2030">
            </div>

            <div class="form-group">
                <label for="ano_modelo">Ano do Modelo *</label>
                <input type="number" id="ano_modelo" name="ano_modelo" placeholder="2024" required min="1900" max="2030">
            </div>

            <div class="form-group">
                <label for="cor">Cor *</label>
                <input type="text" id="cor" name="cor" placeholder="Ex: Preto, Branco, Prata" required maxlength="30">
            </div>

            <div class="form-group">
                <label for="combustivel">Combustível *</label>
                <select id="combustivel" name="combustivel" required>
                    <option value="">Selecione...</option>
                    <option value="Gasolina">Gasolina</option>
                    <option value="Etanol">Etanol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="Flex">Flex</option>
                    <option value="Elétrico">Elétrico</option>
                    <option value="Híbrido">Híbrido</option>
                    <option value="GNV">GNV</option>
                </select>
            </div>

            <div class="form-group">
                <label for="quilometragem">Quilometragem (km) *</label>
                <input type="number" id="quilometragem" name="quilometragem" placeholder="0" required min="0">
            </div>

            <div class="form-group">
                <label for="chassi">Chassi *</label>
                <input type="text" id="chassi" name="chassi" placeholder="Número do chassi" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="renavam">Renavam *</label>
                <input type="text" id="renavam" name="renavam" placeholder="Número do Renavam" required maxlength="50">
            </div>

            <div class="form-group">
                <label for="data_cadastro">Data de Cadastro *</label>
                <input type="date" id="data_cadastro" name="data_cadastro" required>
            </div>

            <div class="form-group full-width">
                <label for="observacoes">Observações *</label>
                <textarea id="observacoes" name="observacoes" placeholder="Descreva o estado do veículo, opcionais, etc." required rows="4"></textarea>
            </div>

            <div class="form-group full-width">
                <button type="submit" class="btn-submit">
                    <span class="btn-text">Cadastrar Veículo</span>
                    <span class="btn-loader" style="display:none;">Processando...</span>
                </button>
            </div>
        </form>

        <div id="mensagem" class="mensagem"></div>

        <div class="links">
            <a href="listar.html" class="link">📋 Ver veículos cadastrados</a>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
